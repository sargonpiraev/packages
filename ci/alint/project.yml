# Product project root shape (lint root = this repo).
# Canonical provider entry is ../.alint.yml (extends this file).
# Meta sibling inventory stays in the meta-repo `.alint.yml`.
#
# MUST presence (every Nx project / shared clone):
#   files: .alint.yml, package.json, package-lock.json, lefthook.yml,
#          project.json, AGENTS.md, commitlint.config.cjs, eslint.config.*,
#          prettier.config.mjs, tsconfig.json
#   dirs:  apps/, packages/, .cursor/, .github/
# Soft / elsewhere: .nvmrc (recommended), .env.example (ESLint env harness when
# runtime env apps exist — see ws__project-governance).
#
# Lefthook: only committed config is lefthook.yml (remotes → ci/lefthook.yml).
# lefthook-local.yml is Lefthook’s optional personal override — gitignore it;
# do not commit it (inventory enforces the ignore). Not file_absent: local
# overrides on disk are allowed.
version: 1

rules:
  # Anchor on package.json (select "." is vacuous in alint); nested checks use root_only.
  - id: project
    kind: for_each_file
    select:
      - "package.json"
    level: error
    message: "Project root is missing required governance files or dirs"
    require:
      - kind: file_exists
        paths: AGENTS.md
        root_only: true
      - kind: file_exists
        paths: lefthook.yml
        root_only: true
      - kind: file_exists
        paths: package.json
        root_only: true
      - kind: file_exists
        paths: package-lock.json
        root_only: true
      - kind: file_exists
        paths: project.json
        root_only: true
      - kind: file_exists
        paths: .alint.yml
        root_only: true
      - kind: file_exists
        paths: commitlint.config.cjs
        root_only: true
      - kind: file_exists
        paths: eslint.config.mjs
        root_only: true
      - kind: file_exists
        paths: prettier.config.mjs
        root_only: true
      - kind: file_exists
        paths: tsconfig.json
        root_only: true
      - kind: dir_exists
        paths: apps
        root_only: true
      - kind: dir_exists
        paths: packages
        root_only: true
      - kind: dir_exists
        paths: .cursor
        root_only: true
      - kind: dir_exists
        paths: .github
        root_only: true

  # Turborepo shape: when turbo.json is present → turbo.json + apps/ + packages/
  # (same dirs as project MUST; keeps an explicit turbo-oriented failure message).
  - id: turborepo
    kind: for_each_file
    select:
      - "turbo.json"
    level: error
    message: "Turborepo root must have turbo.json, apps/, and packages/"
    require:
      - kind: file_exists
        paths: turbo.json
        root_only: true
      - kind: dir_exists
        paths: apps
        root_only: true
      - kind: dir_exists
        paths: packages
        root_only: true
