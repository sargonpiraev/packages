# Provider baseline for consumer lefthook remotes (path: ci/lefthook.yml).
# Mirrors on-push-main baseline checks.

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    lint:
      run: npm run lint
    check-types:
      run: npm run check-types
    build:
      run: npm run build
    test:
      run: npm run test
    audit:
      tags:
        - audit
      run: npm audit --audit-level=critical
