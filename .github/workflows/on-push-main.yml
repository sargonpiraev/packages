name: on-push-main

on:
  workflow_call:
    inputs:
      skip-audit:
        type: boolean
        default: false
        description: Skip npm audit job
      install-playwright:
        type: boolean
        default: false
        description: Install Playwright Chromium before npm test
    secrets:
      POSTGRES_URL:
        required: false
        description: Optional Postgres URL for apps whose npm test runs Playwright against a live DB

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main
      - run: npm run test:eslint

  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main
      - run: npm run check-types

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main
      - name: Build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main
      - name: Install Playwright Chromium
        if: ${{ inputs.install-playwright }}
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run test

  audit:
    if: ${{ !inputs.skip-audit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sargonpiraev/shared/.github/actions/setup-node-npm-ci@main
      - run: npm audit --audit-level=critical
