# Local hooks (audit stays in CI via sargonpiraev/ci on-push-main).
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    lint:
      run: npm run lint
    check-types:
      run: npm run check-types
    build:
      run: npm run build
    test:
      run: npm run test
